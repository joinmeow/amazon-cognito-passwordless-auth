name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimal token permissions: the test job only reads the repo and uploads
# coverage via a dedicated CODECOV_TOKEN secret (not GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full-length commit SHAs: the enterprise policy rejects tags,
      # and an unpinned action fails the run at startup.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"
      - name: install
        run: npm install
      - name: lint
        run: npx eslint .
      - name: prettier
        run: npx prettier -c .
      - name: test with coverage
        run: npm test -- --coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: dist
        run: npm run dist
